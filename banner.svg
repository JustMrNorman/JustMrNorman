<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/>
      <stop offset="0.5" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#060312"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="0.5" stop-color="#FF6EC7"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#FF6EC7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF6EC7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>

  <circle cx="200" cy="150" r="180" fill="url(#glowPurple)" filter="url(#softBlur)">
    <animate attributeName="cx" values="200;320;200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;220;150" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="230" r="160" fill="url(#glowPink)" filter="url(#softBlur)">
    <animate attributeName="cx" values="1080;960;1080" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="380" r="140" fill="url(#glowCyan)" filter="url(#softBlur)">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- атом-гироскоп -->
  <g transform="translate(1050 190)" opacity="0.7">
    <ellipse rx="80" ry="20" stroke="url(#accent)" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="80" ry="20" stroke="url(#accent)" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="80" ry="20" stroke="url(#accent)" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="6" fill="#FF6EC7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- двойной гексагон -->
  <g transform="translate(230 190)" opacity="0.6">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35"
             stroke="url(#accent)" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5"
             stroke="url(#accent)" stroke-width="1" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <text x="640" y="180" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="76" font-weight="900"
        fill="url(#accent)" letter-spacing="3">
    YOUR NAME
  </text>
  <text x="640" y="235" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="300"
        fill="#d0d0ff" letter-spacing="6" opacity="0.9">
    DESIGNER · 3D ARTIST · STUDENT
  </text>

  <line y1="275" y2="275" stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="640;440;640" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="640;840;640" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
