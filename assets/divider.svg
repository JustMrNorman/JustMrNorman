<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" preserveAspectRatio="none">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6EC7" stop-opacity="1"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#divGrad)" stroke-width="1.5"/>

  <circle cy="12" r="4" fill="#FF6EC7">
    <animate attributeName="cx" values="0;1200" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="3" fill="#00D9FF" opacity="0.8">
    <animate attributeName="cx" values="1200;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
