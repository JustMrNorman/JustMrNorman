<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" font-family="'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a8ff"/>
      <stop offset="0.5" stop-color="#ff6ec7"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="outerGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d2a8ff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#8A2BE2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contentShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.15" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type1">
      <rect x="40" y="95" width="0" height="22">
        <animate attributeName="width" from="0" to="270" dur="0.7s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="40" y="145" width="0" height="22">
        <animate attributeName="width" from="0" to="297" dur="0.8s" begin="1.7s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type3">
      <rect x="40" y="332" width="0" height="22">
        <animate attributeName="width" from="0" to="306" dur="1.0s" begin="3.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type4">
      <rect x="40" y="474" width="0" height="22">
        <animate attributeName="width" from="0" to="360" dur="1.2s" begin="5.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <ellipse cx="450" cy="350" rx="500" ry="340" fill="url(#outerGlow)"/>

  <rect x="20" y="20" width="860" height="670" rx="14" fill="url(#termBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <path d="M 34 20 L 866 20 Q 880 20 880 34 L 880 62 L 20 62 L 20 34 Q 20 20 34 20 Z" fill="url(#titleBg)"/>
  <line x1="20" y1="62.5" x2="880" y2="62.5" stroke="#30363d" stroke-width="1"/>

  <circle cx="46" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="90" cy="41" r="6.5" fill="#27c93f"/>

  <text x="450" y="46" text-anchor="middle" fill="#8b949e" font-size="13" font-family="'SF Pro Text',-apple-system,sans-serif">guest@github: ~/profile — zsh</text>

  <rect x="20" y="63" width="860" height="30" fill="url(#contentShade)"/>

  <g font-size="15">
    <text x="40" y="85" fill="#6e7681" opacity="0">Welcome to guest@github — powered by zsh
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
    </text>

    <g clip-path="url(#type1)">
      <text x="40" y="113" fill="#79c0ff">guest@github</text>
      <text x="148" y="113" fill="#6e7681">:</text>
      <text x="157" y="113" fill="#d2a8ff">~/profile</text>
      <text x="238" y="113" fill="#7ee787">$</text>
      <text x="256" y="113" fill="#e6edf3">whoami</text>
    </g>

    <text x="40" y="135" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/>
      <tspan fill="#79c0ff">designer</tspan>
      <tspan fill="#6e7681"> · </tspan>
      <tspan fill="#d2a8ff">3d_artist</tspan>
      <tspan fill="#6e7681"> · </tspan>
      <tspan fill="#7ee787">student</tspan>
    </text>

    <g clip-path="url(#type2)">
      <text x="40" y="163" fill="#79c0ff">guest@github</text>
      <text x="148" y="163" fill="#6e7681">:</text>
      <text x="157" y="163" fill="#d2a8ff">~/profile</text>
      <text x="238" y="163" fill="#7ee787">$</text>
      <text x="256" y="163" fill="#e6edf3">fastfetch</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
      <g transform="translate(80, 274)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
          <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" stroke="#d2a8ff" stroke-width="1.8" fill="none" opacity="0.9"/>
          <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" stroke="#ff6ec7" stroke-width="1.2" fill="none" opacity="0.6"/>
        </g>
        <circle r="4" fill="#ff6ec7">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="160" y="190" fill="#79c0ff" font-weight="bold">guest@github</text>
      <text x="160" y="208" fill="#6e7681">────────────────────────────</text>
      <text x="160" y="230" fill="#8b949e">Role    </text>
      <text x="232" y="230" fill="#e6edf3">designer · 3d_artist · student</text>
      <text x="160" y="252" fill="#8b949e">Loc     </text>
      <text x="232" y="252" fill="#e6edf3">Irkutsk, RU</text>
      <text x="160" y="274" fill="#8b949e">Study   </text>
      <text x="232" y="274" fill="#e6edf3">ISU · Design</text>
      <text x="160" y="296" fill="#8b949e">Exp     </text>
      <text x="232" y="296" fill="#7ee787">3+ years in 3D</text>
      <text x="160" y="318" fill="#8b949e">Focus   </text>
      <text x="232" y="318" fill="#e6edf3">design · motion · 3d · code</text>
    </g>

    <g clip-path="url(#type3)">
      <text x="40" y="350" fill="#79c0ff">guest@github</text>
      <text x="148" y="350" fill="#6e7681">:</text>
      <text x="157" y="350" fill="#d2a8ff">~/profile</text>
      <text x="238" y="350" fill="#7ee787">$</text>
      <text x="256" y="350" fill="#e6edf3">ls skills/</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.0s" fill="freeze"/>
      <text x="55" y="372" fill="#79c0ff">skills/</text>
      <text x="55" y="394">
        <tspan fill="#6e7681">├── </tspan>
        <tspan fill="#d2a8ff">design    </tspan>
        <tspan fill="#e6edf3">figma · photoshop · illustrator</tspan>
      </text>
      <text x="55" y="416">
        <tspan fill="#6e7681">├── </tspan>
        <tspan fill="#d2a8ff">motion    </tspan>
        <tspan fill="#e6edf3">after-effects · premiere-pro · audition</tspan>
      </text>
      <text x="55" y="438">
        <tspan fill="#6e7681">├── </tspan>
        <tspan fill="#d2a8ff">3d        </tspan>
        <tspan fill="#e6edf3">blender </tspan>
        <tspan fill="#7ee787">· 3+ years</tspan>
      </text>
      <text x="55" y="460">
        <tspan fill="#6e7681">└── </tspan>
        <tspan fill="#d2a8ff">code      </tspan>
        <tspan fill="#e6edf3">python · javascript · html · css · cloudflare</tspan>
      </text>
    </g>

    <g clip-path="url(#type4)">
      <text x="40" y="492" fill="#79c0ff">guest@github</text>
      <text x="148" y="492" fill="#6e7681">:</text>
      <text x="157" y="492" fill="#d2a8ff">~/profile</text>
      <text x="238" y="492" fill="#7ee787">$</text>
      <text x="256" y="492" fill="#e6edf3">cat contact.json</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.2s" fill="freeze"/>
      <text x="40" y="514" fill="#6e7681">{</text>
      <text y="536">
        <tspan x="60" fill="#79c0ff">"telegram"</tspan>
        <tspan x="175" fill="#6e7681">:</tspan>
        <tspan x="190" fill="#a5d6ff">"@your_tg"</tspan>
        <tspan x="290" fill="#6e7681">,</tspan>
      </text>
      <text y="558">
        <tspan x="60" fill="#79c0ff">"email"</tspan>
        <tspan x="175" fill="#6e7681">:</tspan>
        <tspan x="190" fill="#a5d6ff">"you@example.com"</tspan>
        <tspan x="355" fill="#6e7681">,</tspan>
      </text>
      <text y="580">
        <tspan x="60" fill="#79c0ff">"behance"</tspan>
        <tspan x="175" fill="#6e7681">:</tspan>
        <tspan x="190" fill="#a5d6ff">"behance.net/you"</tspan>
        <tspan x="355" fill="#6e7681">,</tspan>
      </text>
      <text y="602">
        <tspan x="60" fill="#79c0ff">"status"</tspan>
        <tspan x="175" fill="#6e7681">:</tspan>
        <tspan x="190" fill="#a5d6ff">"open to freelance"</tspan>
      </text>
      <text x="40" y="624" fill="#6e7681">}</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.9s" fill="freeze"/>
      <text x="40" y="656" fill="#79c0ff">guest@github</text>
      <text x="148" y="656" fill="#6e7681">:</text>
      <text x="157" y="656" fill="#d2a8ff">~/profile</text>
      <text x="238" y="656" fill="#7ee787">$</text>
      <rect x="256" y="641" width="9" height="18" fill="#7ee787">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" begin="7.9s"/>
      </rect>
    </g>
  </g>
</svg>
