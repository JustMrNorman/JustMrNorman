<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="328" rx="12"
        fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="2"/>

  <circle cx="24" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="24" r="7" fill="#27c93f"/>

  <text x="360" y="29" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13" fill="#8b949e">
    ~/profile — zsh
  </text>
  <line x1="0" y1="48" x2="720" y2="48" stroke="#30363d"/>

  <g font-family="'Courier New', monospace" font-size="16">
    <text x="24" y="82" fill="#7ee787" opacity="0">$ whoami
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="110" fill="#e6edf3" opacity="0">→ designer · 3d_artist · student
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="24" y="138" fill="#7ee787" opacity="0">$ locate
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
    </text>
    <text x="24" y="166" fill="#e6edf3" opacity="0">→ Irkutsk, RU · ISU · Design
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    </text>
    <text x="24" y="194" fill="#7ee787" opacity="0">$ ls skills/ --starred
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="24" y="222" fill="#e6edf3" opacity="0">→ blender · figma · photoshop · after-effects · premier
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.0s" fill="freeze"/>
    </text>
    <text x="24" y="250" fill="#7ee787" opacity="0">$ status
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.6s" fill="freeze"/>
    </text>
    <text x="24" y="278" fill="#FF6EC7" opacity="0">→ open to freelance ↓
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.1s" fill="freeze"/>
    </text>
    <rect x="24" y="288" width="10" height="18" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
