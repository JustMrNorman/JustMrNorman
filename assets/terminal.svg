<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580"
     font-family="'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#d2a8ff"/>
      <stop offset="0.5"  stop-color="#ff6ec7"/>
      <stop offset="1"    stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="outerGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0"   stop-color="#d2a8ff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#8A2BE2" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contentShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.15" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="type1">
      <rect x="40" y="95" width="0" height="30">
        <animate attributeName="width" from="0" to="270" dur="0.7s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="40" y="145" width="0" height="30">
        <animate attributeName="width" from="0" to="297" dur="0.8s" begin="1.7s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type3">
      <rect x="40" y="331" width="0" height="30">
        <animate attributeName="width" from="0" to="360" dur="1.0s" begin="4.0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- мягкое свечение вокруг окна -->
  <ellipse cx="450" cy="290" rx="540" ry="360" fill="url(#outerGlow)"/>

  <!-- корпус терминала -->
  <rect x="20" y="20" width="860" height="550" rx="14"
        fill="url(#termBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M 34 20 L 866 20 Q 880 20 880 34 L 880 62 L 20 62 L 20 34 Q 20 20 34 20 Z"
        fill="url(#titleBg)"/>
  <line x1="20" y1="62.5" x2="880" y2="62.5" stroke="#30363d" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="46" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="90" cy="41" r="6.5" fill="#27c93f"/>

  <!-- title -->
  <text x="450" y="46" text-anchor="middle" fill="#8b949e" font-size="13"
        font-family="'SF Pro Text',-apple-system,sans-serif">
    guest@github: ~/profile — zsh
  </text>

  <!-- лёгкая тень под title bar -->
  <rect x="20" y="63" width="860" height="30" fill="url(#contentShade)"/>

  <!-- контент -->
  <g font-size="15">

    <!-- welcome -->
    <text x="40" y="85" fill="#6e7681" opacity="0">
      Welcome to guest@github — powered by zsh
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- ∎ prompt 1: whoami -->
    <g clip-path="url(#type1)">
      <text x="40"  y="115" fill="#79c0ff">guest@github</text>
      <text x="148" y="115" fill="#6e7681">:</text>
      <text x="157" y="115" fill="#d2a8ff">~/profile</text>
      <text x="238" y="115" fill="#7ee787">$</text>
      <text x="256" y="115" fill="#e6edf3">whoami</text>
    </g>

    <!-- вывод whoami -->
    <text x="40" y="137" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/>
      <tspan fill="#79c0ff">designer</tspan>
      <tspan fill="#6e7681"> · </tspan>
      <tspan fill="#d2a8ff">3d_artist</tspan>
      <tspan fill="#6e7681"> · </tspan>
      <tspan fill="#7ee787">student</tspan>
    </text>

    <!-- ∎ prompt 2: fastfetch -->
    <g clip-path="url(#type2)">
      <text x="40"  y="165" fill="#79c0ff">guest@github</text>
      <text x="148" y="165" fill="#6e7681">:</text>
      <text x="157" y="165" fill="#d2a8ff">~/profile</text>
      <text x="238" y="165" fill="#7ee787">$</text>
      <text x="256" y="165" fill="#e6edf3">fastfetch</text>
    </g>

    <!-- вывод fastfetch -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>

      <!-- вращающийся гексагон -->
      <g transform="translate(80, 230)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="360" dur="20s" repeatCount="indefinite"/>
          <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
                   stroke="#d2a8ff" stroke-width="1.8" fill="none" opacity="0.9"/>
          <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9"
                   stroke="#ff6ec7" stroke-width="1.2" fill="none" opacity="0.6"/>
        </g>
        <circle r="3.5" fill="#ff6ec7">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="160" y="191" fill="#79c0ff" font-weight="bold">guest@github</text>
      <text x="160" y="213" fill="#6e7681">────────────────────────────</text>

      <text x="160" y="235" fill="#8b949e">Role    </text>
      <text x="232" y="235" fill="#e6edf3">designer · 3d_artist · student</text>

      <text x="160" y="257" fill="#8b949e">Loc     </text>
      <text x="232" y="257" fill="#e6edf3">Irkutsk, RU</text>

      <text x="160" y="279" fill="#8b949e">Study   </text>
      <text x="232" y="279" fill="#e6edf3">ISU · Design</text>

      <text x="160" y="301" fill="#8b949e">Stack   </text>
      <text x="232" y="301" fill="#e6edf3">blender · figma · ps · ae · py</text>

      <text x="160" y="323" fill="#8b949e">Uptime  </text>
      <text x="232" y="323" fill="#e6edf3">3+ years in 3D modeling</text>
    </g>

    <!-- ∎ prompt 3: cat contact.json -->
    <g clip-path="url(#type3)">
      <text x="40"  y="351" fill="#79c0ff">guest@github</text>
      <text x="148" y="351" fill="#6e7681">:</text>
      <text x="157" y="351" fill="#d2a8ff">~/profile</text>
      <text x="238" y="351" fill="#7ee787">$</text>
      <text x="256" y="351" fill="#e6edf3">cat contact.json</text>
    </g>

    <!-- вывод JSON -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s" fill="freeze"/>

      <text x="40" y="373" fill="#6e7681">{</text>

      <text x="60"  y="395" fill="#79c0ff">"telegram"</text>
      <text x="180" y="395" fill="#6e7681">:</text>
      <text x="195" y="395" fill="#a5d6ff">"@your_tg"</text>
      <text x="285" y="395" fill="#6e7681">,</text>

      <text x="60"  y="417" fill="#79c0ff">"email"</text>
      <text x="180" y="417" fill="#6e7681">:</text>
      <text x="195" y="417" fill="#a5d6ff">"you@example.com"</text>
      <text x="348" y="417" fill="#6e7681">,</text>

      <text x="60"  y="439" fill="#79c0ff">"behance"</text>
      <text x="180" y="439" fill="#6e7681">:</text>
      <text x="195" y="439" fill="#a5d6ff">"behance.net/you"</text>
      <text x="348" y="439" fill="#6e7681">,</text>

      <text x="60"  y="461" fill="#79c0ff">"status"</text>
      <text x="180" y="461" fill="#6e7681">:</text>
      <text x="195" y="461" fill="#a5d6ff">"open to freelance"</text>

      <text x="40" y="483" fill="#6e7681">}</text>
    </g>

    <!-- финальный промпт + курсор -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.9s" fill="freeze"/>
      <text x="40"  y="511" fill="#79c0ff">guest@github</text>
      <text x="148" y="511" fill="#6e7681">:</text>
      <text x="157" y="511" fill="#d2a8ff">~/profile</text>
      <text x="238" y="511" fill="#7ee787">$</text>
      <rect x="256" y="496" width="9" height="18" fill="#7ee787">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
